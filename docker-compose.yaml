services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto # Or a specific version like eclipse-mosquitto:2.0.15
    restart: unless-stopped
    ports:
      - "1883:1883/tcp" # Default MQTT port
      - "9001:9001/tcp" # Websockets port, if desired
    volumes:
      - ./mosquitto/config:/mosquitto/config # Mount host config directory to container
      #- ./mosquitto/data:/mosquitto/data   # Mount host data directory for persistence
      #- ./mosquitto/log:/mosquitto/log     # Mount host log directory
      - /etc/localtime:/etc/localtime:ro
    # environment:
    #   - TZ=Europe/Moscow # Optional: Set timezone
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable" # Or specify a version like :2025.11.0
    volumes:
      - ./hass/config:/config
      - /etc/localtime:/etc/localtime:ro
      # Uncomment the following line for Bluetooth support if needed
      # - /run/dbus:/run/dbus:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    # Uncomment the following lines for host networking if needed (e.g., for mDNS/SSDP discovery)
    # network_mode: host
    # privileged: true
    # environment:
    #   - TZ=Europe/Moscow # Optional: Set timezone
  canbridge:
    container_name: bridge
    image: ghcr.io/srgk/can_mqtt_bridge:latest
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # раскомментировать для USB-CAN через /dev/ttyXXX
      # - /dev:/dev
    network_mode: host
    environment:
      - CAN_INTERFACE=socketcan # https://python-can.readthedocs.io/en/stable/configuration.html#interface-name
s
      - CAN_CHANNEL=can0
      # раскомментировать для USB-CAN через /dev/ttyXXX
      # - CAN_BITRATE=50000
      - MQTT_HOST=localhost
      - MQTT_PORT=1883
      # - TZ=Europe/Moscow # Optional: Set timezone
